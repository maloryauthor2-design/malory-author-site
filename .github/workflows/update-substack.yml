name: Refresh Substack posts

on:
  schedule:
    # Daily catch-all, plus a later Friday/Saturday sweep so a Friday essay that
    # goes out after 13:10 UTC (14 Aug went out at 19:11) still lands on the
    # homepage the same day rather than a day late.
    - cron: "10 13 * * *"
    - cron: "10 21 * * 5,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: substack-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bake latest Substack posts into index.html
        run: python3 .github/scripts/update_substack.py

      - name: Render Latest Release block from latest-release.json
        run: python3 .github/scripts/update_latest_release.py

      - name: Refresh the Where-to-Start series counts from books.html
        run: python3 .github/scripts/update_series_counts.py

      - name: Keep JSON-LD dates and book authors honest
        run: python3 .github/scripts/update_schema_dates.py

      - name: Refresh the Amazon offers on the book pages
        run: python3 .github/scripts/update_book_offers.py

      - name: Regenerate sitemap.xml
        run: python3 .github/scripts/update_sitemap.py

      - name: Regenerate search index
        run: python3 .github/scripts/update_search_index.py

      - name: Commit & push if any generated page changed
        run: |
          # Deliberately not a fixed file list. The series-count step can touch any
          # page carrying a Where-to-Start grid (index.html and start-here.html
          # today), and a hardcoded list here is how start-here.html silently
          # stopped being updated once before.
          if git diff --quiet; then
            echo "No change - generated pages already up to date."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto: refresh generated pages"
            git push
          fi
